name: Verify services sync

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-services-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Regenerate services.json from inventory
        run: python3 scripts/generate_services.py

      - name: Fail if services.json drifted from inventory
        run: git diff --exit-code services.json

      - name: Verify README services match services.json
        run: python3 scripts/verify_services_sync.py
